# Firebase App Hosting (Next.js on Cloud Run). One warm instance during judging; set minInstances: 0 afterwards.
runConfig:
  minInstances: 1
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: EMBRACE_STORE
    value: firestore
  - variable: EMBRACE_PUBSUB
    value: "on"
  - variable: GOOGLE_GENAI_API_KEY
    secret: gemini-api-key
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
