# Firebase App Hosting (Next.js on Cloud Run). One warm instance during judging; set minInstances: 0 afterwards.
runConfig:
  minInstances: 1
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: EMBRACE_STORE
    value: firestore
  - variable: EMBRACE_PUBSUB
    value: "on"
  - variable: GOOGLE_GENAI_API_KEY
    secret: gemini-api-key
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
  # One Telegram bot per built-in agency: TELEGRAM_BOT_TOKEN_<AGENCY_ID>. Agencies created in the app connect theirs
  # from the Channels page (stored server-side in Firestore).
  - variable: TELEGRAM_BOT_TOKEN_DINSOS_DEMAK
    secret: telegram-bot-dinsos-demak
  - variable: TELEGRAM_BOT_TOKEN_KPAI
    secret: telegram-bot-kpai
  - variable: TELEGRAM_WEBHOOK_SECRET
    secret: telegram-webhook-secret
  - variable: EMBRACE_PUBLIC_URL
    value: https://embrace.nalaria.ai.id
  # Firebase web config for Analytics in the browser: inlined at build time, so available at BUILD. The API key is
  # public once shipped (restricted to Firebase Installations/Management and our domains) but kept out of the repo.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: embrace-23a9c
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_SENDER_ID
    value: "714975767018"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:714975767018:web:69fb4464cffd7e30fe2a93
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-5PX7TF5KPH
    availability: [BUILD]
